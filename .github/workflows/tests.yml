name: tests

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GHDL
        run: sudo apt-get update && sudo apt-get install -y ghdl

      - name: Install cocotb
        run: pip install cocotb==1.9.2

      - name: Run all testbenches
        run: make test
